<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="section">
      <h1>TEXT EDITOR</h1>
      <div class="button-container">
        <button class="bold" title="Bold Text">Bold</button>
        <button class="italic" title="Italic Text">Italic</button>
        <button class="left-align" title="Left Align"><i class="fas fa-align-left"></i></button>
        <button class="center-align" title="Center Align"><i class="fas fa-align-center"></i></button>
        <button class="right-align" title="Right Align"><i class="fas fa-align-right"></i></button>
        <button class="uppercase" title="Uppercase Text">Upper Case</button>
        <button class="lowercase"  title="Lowecase Text">Lower Case</button>
        <button class="capitalize"  title="Capitalize Text">Capitalize</button>
        <button class="clear" title="Clear Text">Clear Text</button>
      </div>
      <Textarea id="textarea1" rows="15" placeholder="Enter your text here..."></Textarea>
    </section>
    <script src="script.js"></script>
  </body>
</html>
